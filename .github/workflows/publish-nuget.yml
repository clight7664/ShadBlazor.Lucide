name: Publish NuGet Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version override (e.g. 1.33.0)'
        required: false
        type: string
      dry_run:
        description: 'Dry run (Pack only, do not push to NuGet)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore dependencies
        run: dotnet restore ShadBlazor.Lucide.sln

      - name: Build solution (Release)
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            dotnet build ShadBlazor.Lucide.sln -c Release /p:Version="${{ github.event.inputs.version }}"
          else
            dotnet build ShadBlazor.Lucide.sln -c Release
          fi

      - name: Run unit tests
        run: dotnet test tests/ShadBlazor.LucideIcon.Tests/ShadBlazor.LucideIcon.Tests.csproj -c Release --no-build

      - name: Pack NuGet package
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            dotnet pack src/ShadBlazor.LucideIcon/ShadBlazor.LucideIcon.csproj -c Release -o ./artifacts --no-build /p:Version="${{ github.event.inputs.version }}"
          else
            dotnet pack src/ShadBlazor.LucideIcon/ShadBlazor.LucideIcon.csproj -c Release -o ./artifacts --no-build
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: NuGet Trusted Publishing Login
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: NuGet/login@v1
        id: nuget-login

      - name: Push to NuGet.org
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          for pkg in artifacts/*.nupkg; do
            dotnet nuget push "$pkg" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY || secrets.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done
